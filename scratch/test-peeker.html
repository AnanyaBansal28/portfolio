<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #0a090c;
      color: white;
      font-family: sans-serif;
      padding: 100px;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 500px;
      height: 300px;
      background: #1c080d;
      border: 1px solid rgba(114, 28, 36, 0.5);
      border-radius: 24px;
      position: relative;
    }
    .peeker-wrap {
      position: absolute;
      top: 0;
      right: 48px;
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="peeker-wrap" style="transform: translateY(-14px);">
      <!-- Peeker Content -->
      <div style="position: relative; transform: translateY(-38px); display: flex; flex-direction: column; items-center;">
        <div style="width: 80px; height: 48px; overflow: hidden; border-top-left-radius: 40px; border-top-right-radius: 40px; position: relative;">
          <img src="../public/avatar.png" style="width: 140px; height: 180px; position: absolute; top: -14px; left: -30px;" />
        </div>
      </div>
    </div>
  </div>
</body>
</html>
