<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="100%" height="100%">
  <defs>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0810" />
      <stop offset="50%" stop-color="#180408" />
      <stop offset="100%" stop-color="#0e0204" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fedac2" />
      <stop offset="100%" stop-color="#f5b896" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="pantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a22" />
      <stop offset="100%" stop-color="#0e0d12" />
    </linearGradient>
  </defs>

  <!-- PURE TRANSPARENT CUTOUT FIGURE - NO RECTANGULAR BOX OR CARD -->

  <!-- Flowing Long Dark Hair - Back Layer -->
  <path d="M 130 150 C 95 240 115 360 145 400 L 275 400 C 305 360 325 240 290 150 Z" fill="url(#hairGrad)" />

  <!-- Legs / Dark Casual Trousers -->
  <path d="M 165 420 L 160 515 L 200 515 L 208 435 L 212 435 L 220 515 L 260 515 L 255 420 Z" fill="url(#pantGrad)" stroke="#0a090c" stroke-width="2" />

  <!-- Sneaker Shoes with Butter-Yellow Accents -->
  <path d="M 152 515 C 152 515 150 535 170 535 L 202 535 C 205 528 202 515 202 515 Z" fill="#ffffff" stroke="#eab308" stroke-width="2.5" />
  <rect x="150" y="527" width="54" height="6" rx="2" fill="#fef08a" />
  <path d="M 218 515 C 218 515 215 528 218 535 L 250 535 C 270 535 268 515 268 515 Z" fill="#ffffff" stroke="#eab308" stroke-width="2.5" />
  <rect x="216" y="527" width="54" height="6" rx="2" fill="#fef08a" />

  <!-- Oversized Vintage Butter Yellow Hoodie Body -->
  <path d="M 120 425 C 122 315 148 265 190 250 L 230 250 C 272 265 298 315 300 425 Z" fill="url(#jacketGrad)" stroke="#1a0407" stroke-width="3" />

  <!-- Hoodie Zipper & Kangaroo Pockets -->
  <line x1="210" y1="265" x2="210" y2="420" stroke="#ca8a04" stroke-width="3" stroke-dasharray="4,3" />
  <path d="M 148 355 Q 175 370 170 410" stroke="#ca8a04" stroke-width="2.5" fill="none" />
  <path d="M 272 355 Q 245 370 250 410" stroke="#ca8a04" stroke-width="2.5" fill="none" />

  <!-- Arms / Sleeves holding Laptop -->
  <path d="M 124 300 C 114 350 142 390 166 395" stroke="url(#jacketGrad)" stroke-width="28" stroke-linecap="round" fill="none" />
  <path d="M 296 300 C 306 350 278 390 254 395" stroke="url(#jacketGrad)" stroke-width="28" stroke-linecap="round" fill="none" />

  <!-- Laptop (MacBook Pro styling with Glowing Monogram) -->
  <rect x="152" y="355" width="116" height="68" rx="8" fill="#18181b" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="210" cy="389" r="8" fill="#fef08a" />
  <path d="M 146 422 L 274 422" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round" />

  <!-- Hands Holding Laptop Sides -->
  <path d="M 154 380 Q 146 390 156 400" stroke="#f5b896" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 266 380 Q 274 390 264 400" stroke="#f5b896" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Neck & Collar Ribbing -->
  <rect x="194" y="215" width="32" height="40" rx="8" fill="#f5b896" />
  <path d="M 178 255 C 190 270 230 270 242 255" stroke="#ca8a04" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Head & Face -->
  <path d="M 160 145 C 160 90 170 70 210 70 C 250 70 260 90 260 145 C 260 205 242 235 210 235 C 178 235 160 205 160 145 Z" fill="url(#skinGrad)" stroke="#180408" stroke-width="1.5" />

  <!-- Cute Rosy Cheek Blush -->
  <ellipse cx="178" cy="180" rx="11" ry="6" fill="#f43f5e" opacity="0.4" />
  <ellipse cx="242" cy="180" rx="11" ry="6" fill="#f43f5e" opacity="0.4" />

  <!-- Stylish Modern Developer Glasses (Vintage Butter Yellow Wireframe) -->
  <rect x="168" y="148" width="34" height="26" rx="8" fill="none" stroke="#fef08a" stroke-width="3.5" />
  <rect x="218" y="148" width="34" height="26" rx="8" fill="none" stroke="#fef08a" stroke-width="3.5" />
  <line x1="202" y1="161" x2="218" y2="161" stroke="#fef08a" stroke-width="3.5" />

  <!-- Expressive Eyes with Highlights -->
  <circle cx="185" cy="161" r="5" fill="#1c070b" />
  <circle cx="187" cy="159" r="1.5" fill="#ffffff" />
  <circle cx="235" cy="161" r="5" fill="#1c070b" />
  <circle cx="237" cy="159" r="1.5" fill="#ffffff" />

  <!-- Eyebrows & Gentle Smile -->
  <path d="M 172 138 Q 186 132 200 138" stroke="#1c070b" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M 220 138 Q 234 132 248 138" stroke="#1c070b" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M 198 202 Q 210 210 222 202" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Front Hair Fringe / Bangs (Framing the Face) -->
  <path d="M 158 130 C 170 85 200 68 210 68 C 220 68 250 85 262 130 C 250 100 230 92 210 92 C 190 92 170 100 158 130 Z" fill="url(#hairGrad)" />
  <path d="M 158 130 C 164 175 168 220 172 250 C 165 220 162 170 158 130 Z" fill="url(#hairGrad)" />
  <path d="M 262 130 C 256 175 252 220 248 250 C 255 220 258 170 262 130 Z" fill="url(#hairGrad)" />
</svg>
